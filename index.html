<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>🎉 Buscador de Ganador</title>

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      font-family:'Segoe UI',sans-serif;
      background:linear-gradient(135deg,#f8fafc,#e0f2fe);
      min-height:100vh;
      color:#1e293b;
      padding:20px;
    }

    .container-custom{
      max-width:800px;
      margin:auto;
    }

    .titulo{
      text-align:center;
      font-size:2.4rem;
      font-weight:bold;
      margin-bottom:10px;
      color:#0f172a;
    }

    .subtitulo{
      text-align:center;
      color:#475569;
      margin-bottom:30px;
    }

    .card-custom{
      background:white;
      border-radius:30px;
      padding:30px;
      box-shadow:0 10px 30px rgba(0,0,0,0.08);
      margin-bottom:25px;
      border:1px solid #dbeafe;
    }

    .evento-titulo{
      text-align:center;
      font-size:1.5rem;
      font-weight:bold;
      color:#0284c7;
      margin-bottom:15px;
    }

    .evento-detalles{
      display:flex;
      flex-wrap:wrap;
      gap:12px;
      justify-content:center;
    }

    .badge-info{
      background:#e0f2fe;
      color:#0369a1;
      padding:10px 18px;
      border-radius:40px;
      font-size:14px;
    }

    .busqueda{
      display:flex;
      gap:15px;
      flex-wrap:wrap;
    }

    .input-boleto{
      flex:1;
      min-width:220px;
      border:none;
      background:#f1f5f9;
      border-radius:50px;
      padding:16px 22px;
      font-size:1.1rem;
      outline:none;
      color:#0f172a;
    }

    .input-boleto:focus{
      box-shadow:0 0 0 3px #7dd3fc;
    }

    .btn-buscar{
      border:none;
      background:linear-gradient(135deg,#38bdf8,#0ea5e9);
      color:white;
      padding:15px 30px;
      border-radius:50px;
      font-weight:bold;
      transition:0.2s;
    }

    .btn-buscar:hover{
      transform:translateY(-2px);
      background:linear-gradient(135deg,#0ea5e9,#0284c7);
    }

    .resultado{
      display:none;
      animation:fade 0.4s ease;
    }

    @keyframes fade{
      from{
        opacity:0;
        transform:translateY(20px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    .resultado-titulo{
      text-align:center;
      font-size:1.8rem;
      font-weight:bold;
      margin-bottom:25px;
      color:#16a34a;
    }

    .info-box{
      background:#f8fafc;
      border-radius:25px;
      padding:20px;
      border:1px solid #dbeafe;
    }

    .linea{
      display:flex;
      gap:15px;
      padding:14px 0;
      border-bottom:1px solid #e2e8f0;
      flex-wrap:wrap;
    }

    .label{
      min-width:170px;
      font-weight:bold;
      color:#0369a1;
    }

    .valor{
      flex:1;
      color:#0f172a;
      word-break:break-word;
    }

    .boleto-box{
      text-align:center;
      margin-bottom:20px;
    }

    .boleto-numero{
      display:inline-block;
      background:#0ea5e9;
      color:white;
      padding:12px 30px;
      border-radius:50px;
      font-size:1.5rem;
      font-weight:bold;
    }

    .btn-limpiar{
      margin-top:20px;
      border:none;
      background:#e2e8f0;
      color:#0f172a;
      padding:12px 25px;
      border-radius:40px;
      font-weight:bold;
    }

    .loading{
      text-align:center;
      color:#0284c7;
      margin:20px 0;
      font-weight:bold;
    }

    .error{
      color:#dc2626;
      text-align:center;
      font-weight:bold;
      padding:20px;
    }
  </style>
</head>
<body>

<div class="container-custom">

  <div class="titulo">🎫 BUSCADOR DE GANADOR</div>
  <div class="subtitulo">
    Verifica rápidamente el ganador por número de boleto
  </div>

  <!-- EVENTO -->
  <div class="card-custom" id="eventoCard" style="display:none;">
    <div id="eventoHTML"></div>
  </div>

  <!-- LOADING -->
  <div class="loading" id="loading">
    ⏳ Cargando información...
  </div>

  <!-- BUSCADOR -->
  <div class="card-custom">

    <div style="text-align:center;margin-bottom:20px;">
      <h3 style="color:#0284c7;">🔍 Buscar boleto</h3>
      <p style="color:#64748b;">
        Ingrese el número del boleto
      </p>
    </div>

    <div class="busqueda">
      <input
        type="text"
        id="numeroBoleto"
        class="input-boleto"
        placeholder="Ej: 0001"
      >

      <button class="btn-buscar" onclick="buscarGanador()">
        🎯 Buscar
      </button>
    </div>

  </div>

  <!-- RESULTADO -->
  <div class="card-custom resultado" id="resultadoCard">

    <div class="resultado-titulo" id="resultadoTitulo">
      🏆 GANADOR
    </div>

    <div id="resultadoInfo"></div>

    <div style="text-align:center;">
      <button class="btn-limpiar" onclick="limpiarBusqueda()">
        🗑️ Limpiar
      </button>
    </div>

  </div>

</div>

<script>

/* =========================================
   CONFIG SUPABASE
========================================= */

const SUPABASE_URL = "https://otzqicluwfumegmkeebf.supabase.co";
const SUPABASE_KEY = "sb_publishable_9L33HfEG9ekmEBrrouYmHA__NDPk0ep";


const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

/* =========================================
   VARIABLES
========================================= */

let boletos = [];
let eventoData = null;

/* =========================================
   ESCAPE HTML
========================================= */

function escapeHTML(str){
  if(!str) return '';

  return String(str)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;');
}

/* =========================================
   CARGAR EVENTO
========================================= */

async function cargarEvento(){

  const { data, error } = await supabaseClient
    .from('evento')
    .select('*')
    .maybeSingle();

  if(error || !data){
    return;
  }

  eventoData = data;

  document.getElementById("eventoHTML").innerHTML = `
    <div class="evento-titulo">
      🎉 ${escapeHTML(data.nombre_rifa || 'RIFA')}
    </div>

    <div class="evento-detalles">
      <div class="badge-info">
        🏪 ${escapeHTML(data.nombre_local || '')}
      </div>

      <div class="badge-info">
        📍 ${escapeHTML(data.direccion_local || '')}
      </div>

      <div class="badge-info">
        🎁 ${
          escapeHTML(data.lista_premios || '')
            .split(',')
            .join('<br>')
        }
      </div>
    </div>
  `;

  document.getElementById("eventoCard").style.display = "block";
}

/* =========================================
   CARGAR BOLETOS + CLIENTE
========================================= */

async function cargarBoletos(){

  /*
    RELACIONES:

    boletos.fk_id_venta -> ventas.id
    ventas.fk_id_cliente -> clientes.id
  */

  const { data, error } = await supabaseClient
    .from('boletos')
    .select(`
      *,
      ventas (
        id,
        fk_id_cliente,
        clientes (
          nombre_completo,
          telefono,
          direccion
        )
      )
    `);

  if(error){

    console.error(error);

    document.getElementById("loading").innerHTML = `
      <div class="error">
        ❌ Error cargando datos
      </div>
    `;

    return;
  }

  boletos = data || [];

  document.getElementById("loading").style.display = "none";

  console.log("Boletos:", boletos);
}

/* =========================================
   BUSCAR GANADOR
========================================= */

function buscarGanador(){

  const numero = document
    .getElementById("numeroBoleto")
    .value
    .trim();

  if(numero === ''){
    alert("Ingrese un número");
    return;
  }

  const boleto = boletos.find(b => {

    const valor =
      String(
        b.numero_boleto ||
        b.numero ||
        b.boleto ||
        ''
      ).trim();

    return (
      valor === numero ||
      valor === numero.replace(/^0+/,'')
    );
  });

  const resultadoCard =
    document.getElementById("resultadoCard");

  const resultadoInfo =
    document.getElementById("resultadoInfo");

  const resultadoTitulo =
    document.getElementById("resultadoTitulo");

  if(!boleto){

    resultadoTitulo.innerHTML =
      "❌ NO ENCONTRADO";

    resultadoTitulo.style.color =
      "#dc2626";

    resultadoInfo.innerHTML = `
      <div class="error">
        No existe un boleto con el número:
        <br><br>
        <strong>${escapeHTML(numero)}</strong>
      </div>
    `;

    resultadoCard.style.display = "block";

    return;
  }

  const cliente =
    boleto.ventas?.clientes || {};

  resultadoTitulo.innerHTML =
    "🏆 GANADOR ENCONTRADO";

  resultadoTitulo.style.color =
    "#16a34a";

  resultadoInfo.innerHTML = `

    <div class="info-box">

      <div class="boleto-box">
        <div class="boleto-numero">
          🎫 ${escapeHTML(
            boleto.numero_boleto ||
            boleto.numero ||
            boleto.boleto ||
            numero
          )}
        </div>
      </div>

      <div class="linea">
        <div class="label">
          👤 Nombre Completo
        </div>

        <div class="valor">
          ${escapeHTML(cliente.nombre_completo || 'No registrado')}
        </div>
      </div>

      <div class="linea">
        <div class="label">
          📞 Teléfono
        </div>

        <div class="valor">
          ${escapeHTML(cliente.telefono || 'No registrado')}
        </div>
      </div>

      <div class="linea">
        <div class="label">
          📍 Dirección
        </div>

        <div class="valor">
          ${escapeHTML(cliente.direccion || 'No registrada')}
        </div>
      </div>

      ${
        eventoData?.nombre_rifa
        ?
        `
        <div class="linea">
          <div class="label">
            🎉 Sorteo
          </div>

          <div class="valor">
            ${escapeHTML(eventoData.nombre_rifa)}
          </div>
        </div>
        `
        :
        ''
      }

    </div>
  `;

  resultadoCard.style.display = "block";

  resultadoCard.scrollIntoView({
    behavior:'smooth'
  });
}

/* =========================================
   LIMPIAR
========================================= */

function limpiarBusqueda(){

  document.getElementById("numeroBoleto").value = '';

  document.getElementById("resultadoCard").style.display =
    "none";

  document.getElementById("numeroBoleto").focus();
}

/* =========================================
   ENTER
========================================= */

document.addEventListener("DOMContentLoaded", () => {

  document
    .getElementById("numeroBoleto")
    .addEventListener("keypress", function(e){

      if(e.key === "Enter"){
        buscarGanador();
      }
    });
});

/* =========================================
   INICIAR
========================================= */

async function iniciar(){

  await cargarEvento();

  await cargarBoletos();
}

iniciar();

</script>

</body>
</html>
